name: continuous_integration

on:
  push:
    branches:
      - feature/cleanup_and_refactor
  pull_request:
    branches:
      - feature/cleanup_and_refactor
  workflow_dispatch:

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/src/requirements.txt
          pip install pytest pytest-md-report

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/src
        run: |
          pytest scripts/tests --junit-xml=test-results.xml

      - name: Export Test Results
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          path: test-results.xml

          summary: true

          display-options: fEX

          fail-on-empty: true

          title: Test results