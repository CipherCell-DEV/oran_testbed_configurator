name: continuous_integration

on:
  push:
    branches:
      - feature/cleanup_and_refactor
  pull_request:
    branches:
      - feature/cleanup_and_refactor
  workflow_dispatch:

jobs:
  # Ein kombinierter Job ist schneller und stabiler auf dem Hypervisor
  verify:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install All Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/src/requirements.txt
          pip install pytest

      - name: Run Tests
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/src
        run: |
          pytest scripts/tests