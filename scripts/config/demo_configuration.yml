# This file lists all programs called by the run_all.sh script

# Each program has the following parameters
#   <name>: a name to reference the programs by in a readable way
#   <starting_order>: positive integers starting from 1, increasing by 1 each. No duplicates allowed. The programs are started in this order.
#   <command>: command to executed, including parameters 
#   <working_dir>: [Optional] the directory, in which the command is to be started. If this is missing, the project build directory is used instead
#   <success_indication>: may be null or an empty string. This string is used to find out if the associated command has successfully started.
#       This is used to implement the following behaviour: If success string is not null or empty, start the next command in line only if the success string has been printed by the current command. 
#       


# Supported options: [tmux|python]
output_mode: "tmux"

programs:
  run_core:
    restart_timeout_s: 30
    max_num_restart: 3
    program_list: 
      - name: "5G_core"
        starting_order: 1
        command: ["docker", "compose", "up", "5gc"]
        # working_directory: "./repositories"
        success_indication: ["UDR initialize...done"]
  run_ric:
    restart_timeout_s: 30
    max_num_restart: 3
    program_list: 
      - name: "ric"
        starting_order: 2
        command: ["docker", "compose", "up", "dbaas", "rtmgr_sim", "submgr", "e2term", "appmgr", "e2mgr", "python_xapp_runner"]
        # working_directory: "./repositories"
        success_indication: ["RMR is ready now ..."]
  run_gnb:
    restart_timeout_s: 30
    max_num_restart: 3
    program_list:
      - name: "gnb"
        starting_order: 3
        command: ["docker", "compose", "up", "gnb"]
        # working_directory: "./repositories"
        success_indication: ["==== gNB started ==="]
  run_ue:
    restart_timeout_s: 30
    max_num_restart: 3
    program_list:
      - name: "ue1"
        starting_order: 4
        command: ["docker", "compose", "up", "--force-recreate", "ue1"]
        # working_directory: "./repositories"
        success_indication: ["PDU Session Establishment successful."]
  run_misc:
    restart_timeout_s: 30
    max_num_restart: 0
    program_list:
      - name: "monitor_e2"
        starting_order: 5
        command: cat
        # working_directory: "./repository"
        success_indication: null
    
        
        
        
        
        
        
        
    
    

