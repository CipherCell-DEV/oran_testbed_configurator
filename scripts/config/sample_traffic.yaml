parameters:
  core:
    service: 5gc  # Name of the 5G Core docker service
    address: 10.45.0.1
  user-equipments:
    ue1:
      service: ue1  # Name of the UE docker service
      address: 10.45.0.101
    ue2:
      service: ue2  # Name of the UE docker service
      address: 10.45.0.102
  direction: DL  # Direction of traffic. Either DL (Download), UL (Upload) or BI (Bidirectional) (currently not supported)
  workdir: ../../repositories/  # The directory of the main docker-compose file.
  granularity: 100ms  # The granularity of time intervals, i.e. the timespan of one slot in the traffic array.
                      # Anything under 100 ms is probably less than the RTT between UE and gNB and thus not sensible.
  loop: false  # Whether to repeat the pattern forever.
  use_nist: true  # Whether the trafficker is used with the NIST O-RAN Testbed or the CipherCell Configurator (default).
  nist_vm_ssh: root@132.231.14.134  # Needs to be able to execute commands as root without authentication
  use_udp: true  # Whether to try to use UDP instead of TCP for generating traffic. Using UDP limits the amount of data
                 # that can be sent in one packet (gets sent every 100 ms on each device) to 65 kB.



# Supported units: Timespans can be given in ms, s, m or h; packet sizes can be given in B, kB, MB, GB
traffic:
  ue1:
    - periodic:
        size: 30kB
        interval: 300ms
        duration: 2s
    - random:
        offset: 1s
        duration: 1s
        min_size: 0kB
        max_size: 40kB
  ue2:
    - random:
        duration: 1s
        min_size: 0kB
        max_size: 40kB
    - periodic:
        offset: 1s
        size: 30kB
        interval: 400ms
        duration: 2s
