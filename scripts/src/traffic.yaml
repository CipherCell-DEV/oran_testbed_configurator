parameters:
  gnb-address: 10.45.1.1
  ue-address: 10.45.1.2
  workdir: ../../
  granularity: 100ms
  loop: false

traffic:
  - loop:
      iterations: 3
      elements:
        - overlap:
          - periodic:
              offset: 0ms
              size: 50kB
              interval: 100ms
              duration: 6s
          - periodic:
              offset: 500ms
              size: 30kB
              interval: 200ms
              duration: 5s
          - random:
              offset: 2500ms
              duration: 1s
              min_size: 0kB
              max_size: 100kB
        - pause:
            duration: 1s
        - periodic:
            size: 100kB
            interval: 500ms
            duration: 5s
        - pause:
            duration: 1s
        - random:
            duration: 3s
            min_size: 10kB
            max_size: 50kB
        - pause:
            duration: 1s
        - distribution:
            duration: 3s
            cumulative_size: 300kB
            type: 'normal-distribution'
        - pause:
            duration: 1s
        - distribution:
            duration: 3s
            cumulative_size: 300kB
            type: 'uniform-distribution'
        - pause:
            duration: 1s
        - distribution:
            duration: 3s
            cumulative_size: 300kB
            type: 'exponential-distribution'
