<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "CipherCell Configurator" }}</title>
  <style>
    :root{--bg:#f7f9fb;--muted:#6b7280;--accent:#0366d6;--radius:8px;--maxw:900px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial}
    html,body{height:100%;margin:0;background:var(--bg);color:#111}
    .wrap{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding:24px}
    .container{max-width:var(--maxw);width:100%}
    header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
    .logo{width:64px;height:40px}
    .title{font-weight:700;font-size:1.1rem}
    .subtitle{color:var(--muted);font-size:0.95rem}
    .card{background:#fff;padding:14px;border-radius:var(--radius);border:1px solid rgba(0,0,0,0.05)}
    h1{margin:0 0 8px;font-size:1.05rem}
    p{margin:0 0 12px;color:var(--muted)}
    .ep{display:flex;gap:12px;margin-bottom:8px}
    .method{color:var(--accent);font-weight:700;min-width:80px}
    .path{font-family:monospace;background:#f1f5f9;padding:2px 6px;border-radius:6px}
    .section-title{font-size:0.98rem;margin-top:12px;margin-bottom:8px}
    pre{background:#0b1220;color:#dbeafe;padding:10px;border-radius:6px;overflow:auto;font-size:0.9rem}
    .muted{color:var(--muted)}
    footer{margin-top:12px;font-size:0.9rem;color:var(--muted)}
    @media (max-width:600px){.logo{width:48px;height:30px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="container">
      <header>
        <div class="logo" aria-hidden="true">
          <img src="/doc/cc_logo.png" alt="CipherCell Logo" style="width:100%;height:100%;object-fit:contain;display:block">
        </div>

        <div>
          <div class="title">CipherCell Configurator</div>
          <div class="subtitle">{{ description or "Access the CipherCell Configurator API" }}</div>
        </div>

        <div style="margin-left:auto;color:var(--muted);align-self:center">Version: <strong>{{ version or "unknown" }}</strong></div>
      </header>

      <div class="section-title">Documentation</div>
      <div style="margin-bottom:12px">
        <div class="muted">Interactive API documentation (ReDoc) is available below, served at <span class="path">/redocs</span>.</div>
        <div style="margin-top:8px">
          <iframe src="/redoc" title="ReDoc" style="width:100%;height:640px;border:1px solid rgba(0,0,0,0.08);border-radius:6px;"></iframe>
        </div>
        <div style="margin-top:8px" class="muted">If the iframe is blocked by your browser, open <a href="/redocs" target="_blank" rel="noopener">/redocs</a> directly.</div>
      </div>

    </div>
  </div>
</body>
</html>
