services:
  mongodb:
    image: mongo:6
    container_name: open5gs_mongodb
    networks:
      ran:
        ipv4_address: 10.53.1.5
    restart: unless-stopped
    command: --bind_ip_all


  5gc:
    build: ./open5gs
    image: 132.231.14.130:8080/5gc:latest
    container_name: open5gcore
    privileged: true
    platform: linux/amd64
    ports:
      - "9999:9999/tcp"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    depends_on:
      - mongodb
    networks:
      ran:
        ipv4_address: 10.53.1.2
    user: root
    restart: unless-stopped

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24
